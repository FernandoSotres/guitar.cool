<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Comentarios — tremolo.mx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper:  #f4ece0; --paper2: #f2ece3; --paper3: #e8e0d4; --paper4: #c8b99f;
  --copper: #a85a1e; --copper-dk: #7a3e10;
  --ink:    #1c1410; --ink2: #2e2418; --ink3: #4a3c2c; --ink4: #8a7a64; --ink5: #8a7a66;
  --green:  #2e7d52; --green-dk: #1a5c38;
  --serif: 'Marcellus', Georgia, serif;
  --sans:  'Inter', system-ui, sans-serif;
  --mono:  'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; min-height: 100vh; }

nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(244,236,224,.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--paper4);
  padding: 0 48px; display: flex; align-items: center; height: 60px; gap: 0;
}
.nav-logo { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); margin-right: 16px; letter-spacing: -.01em; text-decoration: none; }
.nav-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 4px;
  background: var(--green); color: #fff;
}
.nav-back {
  margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink4);
  text-decoration: none; letter-spacing: .04em;
}
.nav-back:hover { color: var(--ink2); }

.dash-header {
  background: #0d0804; padding: 56px 48px 52px;
  position: relative; overflow: hidden;
}
.dash-header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 80% at 50% 120%, rgba(46,125,82,.25) 0%, transparent 70%);
  pointer-events: none;
}
.dash-eyebrow {
  font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .22em;
  text-transform: uppercase; color: #2e7d52; margin-bottom: 16px; position: relative;
}
.dash-title {
  font-family: var(--serif); font-size: clamp(32px, 5vw, 56px);
  color: var(--paper); font-weight: 700; letter-spacing: -.03em; line-height: .95;
  margin-bottom: 14px; position: relative;
}
.dash-title em { font-style: italic; color: #4aad78; }
.dash-stats {
  display: flex; gap: 20px; flex-wrap: wrap; margin-top: 24px; position: relative;
}
.dash-stat {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px; padding: 12px 20px;
}
.dash-stat-n { font-family: var(--mono); font-size: 26px; font-weight: 700; color: #4aad78; }
.dash-stat-l { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,236,224,.35); margin-top: 2px; }

.dash-controls {
  padding: 24px 48px; background: var(--paper2); border-bottom: 1px solid var(--paper3);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.dash-filter-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink4); }
.dash-select {
  background: #fff; border: 1px solid var(--paper4); border-radius: 6px;
  padding: 7px 12px; font-family: var(--mono); font-size: 12px; color: var(--ink);
  outline: none; cursor: pointer;
}
.dash-select:focus { border-color: var(--green); }
.dash-refresh {
  margin-left: auto; background: transparent; border: 1px solid var(--paper4);
  border-radius: 6px; padding: 7px 16px; font-family: var(--mono); font-size: 11px;
  color: var(--ink4); cursor: pointer; transition: all .2s; letter-spacing: .06em;
  text-transform: uppercase;
}
.dash-refresh:hover { border-color: var(--green); color: var(--green); }

.dash-body { padding: 40px 48px 80px; }
.dash-inner { max-width: 860px; margin: 0 auto; }

.dash-group { margin-bottom: 44px; }
.dash-group-head {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
  padding-bottom: 10px; border-bottom: 2px solid var(--paper3);
}
.dash-group-slug { font-family: var(--serif); font-size: 22px; color: var(--ink); text-transform: capitalize; }
.dash-group-count { font-family: var(--mono); font-size: 11px; color: var(--ink4); letter-spacing: .06em; }

.dash-card {
  background: #fff; border: 1px solid var(--paper4); border-radius: 10px;
  padding: 18px 20px 16px; margin-bottom: 10px;
  display: flex; gap: 12px; justify-content: space-between;
}
.dash-card-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.dash-card-name { font-weight: 600; font-size: 13px; color: var(--ink); }
.dash-card-date { font-family: var(--mono); font-size: 10px; color: var(--ink4); letter-spacing: .04em; }
.dash-card-text { font-size: 14px; color: var(--ink3); line-height: 1.65; }
.dash-card-slug-pill {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
  background: rgba(46,125,82,.1); color: var(--green); white-space: nowrap; align-self: start; flex-shrink: 0;
}

.dash-empty { font-size: 14px; color: var(--ink4); font-style: italic; padding: 40px 0; }
.dash-loading { font-family: var(--mono); font-size: 13px; color: var(--ink4); letter-spacing: .06em; padding: 40px 0; }

@media (max-width: 768px) {
  nav { padding: 0 16px; }
  .dash-header { padding: 40px 20px 36px; }
  .dash-controls { padding: 16px 20px; }
  .dash-body { padding: 28px 20px 60px; }
  .dash-card { flex-direction: column; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">trémolo</a>
  <span class="nav-badge">Comentarios</span>
  <a href="/" class="nav-back">← Inicio</a>
</nav>

<div class="dash-header">
  <div class="dash-eyebrow">tremolo.mx · Panel</div>
  <h1 class="dash-title">Todos los<br><em>comentarios</em></h1>
  <div class="dash-stats">
    <div class="dash-stat">
      <div class="dash-stat-n" id="stat-total">—</div>
      <div class="dash-stat-l">Total</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-n" id="stat-pages">—</div>
      <div class="dash-stat-l">Páginas</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-n" id="stat-today">—</div>
      <div class="dash-stat-l">Hoy</div>
    </div>
  </div>
</div>

<div class="dash-controls">
  <span class="dash-filter-label">Filtrar:</span>
  <select class="dash-select" id="adm-filter">
    <option value="">Todas las páginas</option>
  </select>
  <button class="dash-refresh" id="adm-refresh">↻ Actualizar</button>
</div>

<div class="dash-body">
  <div class="dash-inner" id="dash-list">
    <p class="dash-loading">Cargando comentarios…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPA_URL = 'https://osgbjknlajdxlbfeueqc.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZ2Jqa25sYWpkeGxiZmV1ZXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjcyMTYsImV4cCI6MjA5MzQ0MzIxNn0.6cDM7Xpf7ZkdwH88uBPPP3xH0GZGqXiEJBdnK7pSDW4';

  var sb, allComments = [];

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(iso) {
    return new Date(iso).toLocaleString('es-MX', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function fmtSlug(s) {
    return s.replace(/-/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
  }

  function updateStats() {
    var today = new Date().toISOString().slice(0,10);
    var todayN = allComments.filter(function(c){ return c.created_at.startsWith(today); }).length;
    var slugs = {};
    allComments.forEach(function(c){ slugs[c.page_slug] = 1; });
    document.getElementById('stat-total').textContent = allComments.length;
    document.getElementById('stat-pages').textContent = Object.keys(slugs).length;
    document.getElementById('stat-today').textContent = todayN;
  }

  function populateFilter(slugs) {
    var sel = document.getElementById('adm-filter');
    while (sel.options.length > 1) sel.remove(1);
    slugs.sort().forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = fmtSlug(s);
      sel.appendChild(opt);
    });
  }

  function renderDash(filterSlug) {
    var list = document.getElementById('dash-list');
    var data = filterSlug ? allComments.filter(function(c){ return c.page_slug === filterSlug; }) : allComments;

    if (data.length === 0) {
      list.innerHTML = '<p class="dash-empty">No hay comentarios aún.</p>';
      return;
    }

    var groups = {};
    data.forEach(function(c) {
      if (!groups[c.page_slug]) groups[c.page_slug] = [];
      groups[c.page_slug].push(c);
    });

    var html = '';
    Object.keys(groups).sort().forEach(function(slug) {
      var comments = groups[slug];
      html += '<div class="dash-group">';
      html += '<div class="dash-group-head">';
      html += '<span class="dash-group-slug">' + esc(fmtSlug(slug)) + '</span>';
      html += '<span class="dash-group-count">' + comments.length + ' comentario' + (comments.length !== 1 ? 's' : '') + '</span>';
      html += '</div>';
      comments.forEach(function(c) {
        html += '<div class="dash-card">';
        html += '<div>';
        html += '<div class="dash-card-meta">';
        html += '<span class="dash-card-name">' + esc(c.user_name) + '</span>';
        html += '<span class="dash-card-date">' + fmtDate(c.created_at) + '</span>';
        html += '</div>';
        html += '<p class="dash-card-text">' + esc(c.comment_text).replace(/\n/g,'<br>') + '</p>';
        html += '</div>';
        html += '<span class="dash-card-slug-pill">' + esc(slug) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    });

    list.innerHTML = html;
  }

  function loadComments() {
    document.getElementById('dash-list').innerHTML = '<p class="dash-loading">Cargando…</p>';
    sb.from('comments')
      .select('*')
      .order('created_at', { ascending: false })
      .then(function(res) {
        if (res.error) {
          document.getElementById('dash-list').innerHTML = '<p class="dash-empty">Error al cargar.</p>';
          return;
        }
        allComments = res.data || [];
        updateStats();
        var slugs = [];
        var seen = {};
        allComments.forEach(function(c){ if(!seen[c.page_slug]){ seen[c.page_slug]=1; slugs.push(c.page_slug); } });
        populateFilter(slugs);
        renderDash(document.getElementById('adm-filter').value || '');
      });
  }

  document.getElementById('adm-filter').addEventListener('change', function() {
    renderDash(this.value);
  });
  document.getElementById('adm-refresh').addEventListener('click', loadComments);

  function init() {
    if (window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      loadComments();
      return;
    }
    setTimeout(init, 100);
  }
  init();
})();
</script>
</body>
</html>
